Usage:
  helm dependency [command]

Aliases:
  dependency, dep, dependencies

Available Commands:
  build       rebuild the charts/ directory based on the Chart.lock file
  list        list the dependencies for the given chart
  update      update charts/ based on the contents of Chart.yaml

Flags:
  -h, --help   help for dependency

Global Flags:
      --burst-limit int                 client-side default throttling limit (default 100)
      --color string                    use colored output (never, auto, always) (default "auto")
      --colour string                   use colored output (never, auto, always) (default "auto")
      --content-cache string            path to the directory containing cached content (e.g. charts) (default "C:\Users\Hi\AppData\Local\Temp\helm\content")
      --debug                           enable verbose output
      --kube-apiserver string           the address and the port for the Kubernetes API server
      --kube-as-group stringArray       group to impersonate for the operation, this flag can be repeated to specify multiple groups.
      --kube-as-user string             username to impersonate for the operation
      --kube-ca-file string             the certificate authority file for the Kubernetes API server connection
      --kube-context string             name of the kubeconfig context to use
      --kube-insecure-skip-tls-verify   if true, the Kubernetes API server's certificate will not be checked for validity. This will make your HTTPS connections insecure
      --kube-tls-server-name string     server name to use for Kubernetes API server certificate validation. If it is not provided, the hostname used to contact the server is used
      --kube-token string               bearer token used for authentication
      --kubeconfig string               path to the kubeconfig file
  -n, --namespace string                namespace scope for this request
      --qps float32                     queries per second used when communicating with the Kubernetes API, not including bursting
      --registry-config string          path to the registry config file (default "C:\Users\Hi\AppData\Roaming\helm\registry\config.json")
      --repository-cache string         path to the directory containing cached repository indexes (default "C:\Users\Hi\AppData\Local\Temp\helm\repository")
      --repository-config string        path to the file containing repository names and URLs (default "C:\Users\Hi\AppData\Roaming\helm\repositories.yaml")

Use "helm dependency [command] --help" for more information about a command. verifies every entry in Chart.lock against a
        # KNOWN repository even when the .tgz is already vendored under
        # charts/, so it fails with "no repository definition" on a clean
        # runner while the identical command succeeds on a laptop that added
        # the repo months ago. The OCI dependency needs no line here: an
        # oci:// reference is resolved by registry, not by repo alias.
        run: helm repo add qdrant https://qdrant.github.io/qdrant-helm

      - name: Helm dependency build
        run: helm dependency build "charts/${{ matrix.chart }}"

      - name: Package chart
        run: |
          mkdir -p "${PKG_DIR}"
          helm package "charts/${{ matrix.chart }}" --destination "${PKG_DIR}"

      - name: Upload packaged chart
        uses: actions/upload-artifact@v4
        with:
          name: packaged-chart-${{ matrix.chart }}
          path: ${{ env.PKG_DIR }}/*.tgz
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Download packaged charts
        uses: actions/download-artifact@v4
        with:
          pattern: packaged-chart-*
          path: ${{ env.PKG_DIR }}
          merge-multiple: true

      - name: Generate index.yaml
        # ONE index for BOTH charts — `helm repo index` merges by chart name,
        # so re-running it here over both packages is safe and is what lets
        # `helm repo add nivo-charts https://<owner>.github.io/<repo>/charts`
        # serve both from a single repo URL.
        run: |
          BASE_URL="https://${CHARTS_DOMAIN}/charts"

          # THE URL BAKED IN HERE IS THE ONE CLIENTS ACTUALLY FETCH FROM.
          # `helm repo index --url` writes an absolute download URL for every
          # entry, so `helm repo add` succeeding proves only that index.yaml
          # was reachable -- if this URL is stale, the FAILURE lands later, on
          # `helm install`, as a 404 on the .tgz. That is why it is derived
          # from CHARTS_DOMAIN rather than from GITHUB_REPOSITORY: the repo
          # can be renamed or transferred between owners (this one already
          # moved from starci183 to starci-lab) without silently repointing
          # every published chart at an address nothing serves.
          helm repo index "${OUT_DIR}" --url "${BASE_URL}"

      - name: Verify the custom domain is wired
        # Cheap, and it catches the one failure this setup is prone to: a
        # CNAME that drifts from the URL in index.yaml. Pages would serve the
        # site and helm would resolve the index, so nothing looks broken until
        # a customer's provision Job cannot pull its chart.
        run: |
          test -f public/CNAME || { echo "public/CNAME missing"; exit 1; }
          test "$(tr -d '[:space:]' < public/CNAME)" = "${CHARTS_DOMAIN}" || {
            echo "public/CNAME is $(cat public/CNAME), expected ${CHARTS_DOMAIN}"
            exit 1
          }
          grep -q "https://${CHARTS_DOMAIN}/charts" "${OUT_DIR}/index.yaml" || {
            echo "index.yaml does not carry https://${CHARTS_DOMAIN}/charts"
            exit 1
          }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
