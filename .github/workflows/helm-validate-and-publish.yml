name: helm-validate-and-publish

# Mirrors starci-lab/kani-k8s's helm-validate-and-publish.yml, extended from
# one chart to a matrix covering every chart in this repository. Each chart
# validates independently with its own representative, non-secret smoke values.

on:
  pull_request:
    paths:
      - "charts/**"
  push:
    branches: ["main"]
    paths:
      - "charts/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  OUT_DIR: public/charts
  PKG_DIR: public/charts
  # The published repository URL. It is a custom domain, not the
  # `<owner>.github.io/<repo>` default, and `public/CNAME` is what tells
  # GitHub Pages to answer on it -- the two must agree or the domain serves a
  # 404 while every step here still goes green.
  CHARTS_DOMAIN: charts.nivo.vn

jobs:
  validate:
    strategy:
      matrix:
        include:
          - chart: agentos
            smoke_args: >-
              --set-string bootstrap.token=ci-smoke-test
              --set-string instance.id=ci-smoke-test
              --set-string instance.name=ci-smoke-test
          - chart: expert-academy
            smoke_args: >-
              --set-string bootstrap.token=ci-smoke-test
              --set-string instance.id=ci-smoke-test
              --set-string instance.name=ci-smoke-test
          - chart: mmo
            smoke_args: >-
              --set-string image.repository=example.invalid/nivo/mmo
              --set-string image.tag=ci-smoke-test
              --set service.port=8080
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Register dependency repositories
        # `helm dependency build` verifies every Chart.lock entry against a
        # KNOWN repository even when the .tgz is already vendored under
        # charts/, so it fails with "no repository definition" on a clean
        # runner while the identical command succeeds on a laptop that added
        # that repo months ago.
        #
        # The OCI dependency needs no line here: an oci:// reference is
        # resolved by registry, not by repo alias.
        run: helm repo add qdrant https://qdrant.github.io/qdrant-helm

      - name: Helm dependency build
        # Uses the checked-in Chart.lock + charts/*.tgz — a PR that bumps a
        # dependency version must run `helm dependency update` locally and
        # commit the result, so CI proves the SAME lock the reviewer saw,
        # never a freshly re-resolved one.
        run: helm dependency build "charts/${{ matrix.chart }}"

      - name: Helm lint
        run: helm lint "charts/${{ matrix.chart }}" ${{ matrix.smoke_args }}

      - name: Helm template (smoke test)
        run: |
          helm template test "charts/${{ matrix.chart }}" \
            ${{ matrix.smoke_args }} \
            > /dev/null

  build:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    strategy:
      matrix:
        chart: [agentos, expert-academy, mmo]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Register dependency repositories
        # `helm dependency build` verifies every Chart.lock entry against a
        # KNOWN repository even when the .tgz is already vendored under
        # charts/, so it fails with "no repository definition" on a clean
        # runner while the identical command succeeds on a laptop that added
        # that repo months ago.
        #
        # The OCI dependency needs no line here: an oci:// reference is
        # resolved by registry, not by repo alias.
        run: helm repo add qdrant https://qdrant.github.io/qdrant-helm

      - name: Helm dependency build
        run: helm dependency build "charts/${{ matrix.chart }}"

      - name: Package chart
        run: |
          mkdir -p "${PKG_DIR}"
          helm package "charts/${{ matrix.chart }}" --destination "${PKG_DIR}"

      - name: Upload packaged chart
        uses: actions/upload-artifact@v4
        with:
          name: packaged-chart-${{ matrix.chart }}
          path: ${{ env.PKG_DIR }}/*.tgz
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Download packaged charts
        uses: actions/download-artifact@v4
        with:
          pattern: packaged-chart-*
          path: ${{ env.PKG_DIR }}
          merge-multiple: true

      - name: Generate index.yaml
        # ONE index for ALL charts — `helm repo index` merges by chart name,
        # so re-running it here over every package is safe and is what lets
        # `helm repo add nivo-charts https://<owner>.github.io/<repo>/charts`
        # serve every chart from a single repo URL.
        run: |
          BASE_URL="https://${CHARTS_DOMAIN}/charts"

          # THE URL BAKED IN HERE IS THE ONE CLIENTS ACTUALLY FETCH FROM.
          # `helm repo index --url` writes an absolute download URL for every
          # entry, so `helm repo add` succeeding proves only that index.yaml
          # was reachable -- if this URL is stale, the FAILURE lands later, on
          # `helm install`, as a 404 on the .tgz. That is why it is derived
          # from CHARTS_DOMAIN rather than from GITHUB_REPOSITORY: the repo
          # can be renamed or transferred between owners (this one already
          # moved from starci183 to starci-lab) without silently repointing
          # every published chart at an address nothing serves.
          helm repo index "${OUT_DIR}" --url "${BASE_URL}"

      - name: Verify the custom domain is wired
        # Cheap, and it catches the one failure this setup is prone to: a
        # CNAME that drifts from the URL in index.yaml. Pages would serve the
        # site and helm would resolve the index, so nothing looks broken until
        # a customer's provision Job cannot pull its chart.
        run: |
          test -f public/CNAME || { echo "public/CNAME missing"; exit 1; }
          test "$(tr -d '[:space:]' < public/CNAME)" = "${CHARTS_DOMAIN}" || {
            echo "public/CNAME is $(cat public/CNAME), expected ${CHARTS_DOMAIN}"
            exit 1
          }
          grep -q "https://${CHARTS_DOMAIN}/charts" "${OUT_DIR}/index.yaml" || {
            echo "index.yaml does not carry https://${CHARTS_DOMAIN}/charts"
            exit 1
          }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
