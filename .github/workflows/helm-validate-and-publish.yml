name: helm-validate-and-publish

# Mirrors starci-lab/kani-k8s's helm-validate-and-publish.yml, extended from
# one chart to a matrix of two: charts/agentos and charts/expert-academy.
# Each chart validates independently — a broken expert-academy chart must
# never block an agentos release, and vice versa.

on:
  pull_request:
    paths:
      - "charts/**"
  push:
    branches: ["main"]
    paths:
      - "charts/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  OUT_DIR: public/charts
  PKG_DIR: public/charts

jobs:
  validate:
    strategy:
      matrix:
        chart: [agentos, expert-academy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Helm dependency build
        # Uses the checked-in Chart.lock + charts/*.tgz — a PR that bumps a
        # dependency version must run `helm dependency update` locally and
        # commit the result, so CI proves the SAME lock the reviewer saw,
        # never a freshly re-resolved one.
        run: helm dependency build "charts/${{ matrix.chart }}"

      - name: Helm lint
        run: helm lint "charts/${{ matrix.chart }}"

      - name: Helm template (smoke test)
        run: |
          helm template test "charts/${{ matrix.chart }}" \
            --set bootstrap.token=ci-smoke-test \
            --set instance.id=ci-smoke-test \
            --set instance.name=ci-smoke-test \
            > /dev/null

  build:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    strategy:
      matrix:
        chart: [agentos, expert-academy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Helm dependency build
        run: helm dependency build "charts/${{ matrix.chart }}"

      - name: Package chart
        run: |
          mkdir -p "${PKG_DIR}"
          helm package "charts/${{ matrix.chart }}" --destination "${PKG_DIR}"

      - name: Upload packaged chart
        uses: actions/upload-artifact@v4
        with:
          name: packaged-chart-${{ matrix.chart }}
          path: ${{ env.PKG_DIR }}/*.tgz
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Download packaged charts
        uses: actions/download-artifact@v4
        with:
          pattern: packaged-chart-*
          path: ${{ env.PKG_DIR }}
          merge-multiple: true

      - name: Generate index.yaml
        # ONE index for BOTH charts — `helm repo index` merges by chart name,
        # so re-running it here over both packages is safe and is what lets
        # `helm repo add nivo-charts https://<owner>.github.io/<repo>/charts`
        # serve both from a single repo URL.
        run: |
          OWNER="$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f1)"
          REPO="$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f2)"
          BASE_URL="https://${OWNER}.github.io/${REPO}/charts"

          helm repo index "${OUT_DIR}" --url "${BASE_URL}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
