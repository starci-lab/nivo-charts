name: helm-validate-and-publish

# Mirrors starci-lab/kani-k8s's helm-validate-and-publish.yml, extended from
# one chart to a matrix of two: charts/agentos and charts/expert-academy.
# Each chart validates independently — a broken expert-academy chart must
# never block an agentos release, and vice versa.

on:
  pull_request:
    paths:
      - "charts/**"
  push:
    branches: ["main"]
    paths:
      - "charts/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  OUT_DIR: public/charts
  PKG_DIR: public/charts
  # The published repository URL. It is a custom domain, not the
  # `<owner>.github.io/<repo>` default, and `public/CNAME` is what tells
  # GitHub Pages to answer on it -- the two must agree or the domain serves a
  # 404 while every step here still goes green.
  CHARTS_DOMAIN: charts.nivo.vn

jobs:
  validate:
    strategy:
      matrix:
        chart: [agentos, expert-academy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Register dependency repositories
        # Manage the dependencies of a chart.

Helm charts store their dependencies in 'charts/'. For chart developers, it is
often easier to manage dependencies in 'Chart.yaml' which declares all
dependencies.

The dependency commands operate on that file, making it easy to synchronize
between the desired dependencies and the actual dependencies stored in the
'charts/' directory.

For example, this Chart.yaml declares two dependencies:

    # Chart.yaml
    dependencies:
    - name: nginx
      version: "1.2.3"
      repository: "https://example.com/charts"
    - name: memcached
      version: "3.2.1"
      repository: "https://another.example.com/charts"


The 'name' should be the name of a chart, where that name must match the name
in that chart's 'Chart.yaml' file.

The 'version' field should contain a semantic version or version range.

The 'repository' URL should point to a Chart Repository. Helm expects that by
appending '/index.yaml' to the URL, it should be able to retrieve the chart
repository's index. Note: 'repository' can be an alias. The alias must start
with 'alias:' or '@'.

Starting from 2.2.0, repository can be defined as the path to the directory of
the dependency charts stored locally. The path should start with a prefix of
"file://". For example,

    # Chart.yaml
    dependencies:
    - name: nginx
      version: "1.2.3"
      repository: "file://../dependency_chart/nginx"

If the dependency chart is retrieved locally, it is not required to have the
repository added to helm by "helm add repo". Version matching is also supported
for this case.

Usage:
  helm dependency [command]

Aliases:
  dependency, dep, dependencies

Available Commands:
  build       rebuild the charts/ directory based on the Chart.lock file
  list        list the dependencies for the given chart
  update      update charts/ based on the contents of Chart.yaml

Flags:
  -h, --help   help for dependency

Global Flags:
      --burst-limit int                 client-side default throttling limit (default 100)
      --color string                    use colored output (never, auto, always) (default "auto")
      --colour string                   use colored output (never, auto, always) (default "auto")
      --content-cache string            path to the directory containing cached content (e.g. charts) (default "C:\Users\Hi\AppData\Local\Temp\helm\content")
      --debug                           enable verbose output
      --kube-apiserver string           the address and the port for the Kubernetes API server
      --kube-as-group stringArray       group to impersonate for the operation, this flag can be repeated to specify multiple groups.
      --kube-as-user string             username to impersonate for the operation
      --kube-ca-file string             the certificate authority file for the Kubernetes API server connection
      --kube-context string             name of the kubeconfig context to use
      --kube-insecure-skip-tls-verify   if true, the Kubernetes API server's certificate will not be checked for validity. This will make your HTTPS connections insecure
      --kube-tls-server-name string     server name to use for Kubernetes API server certificate validation. If it is not provided, the hostname used to contact the server is used
      --kube-token string               bearer token used for authentication
      --kubeconfig string               path to the kubeconfig file
  -n, --namespace string                namespace scope for this request
      --qps float32                     queries per second used when communicating with the Kubernetes API, not including bursting
      --registry-config string          path to the registry config file (default "C:\Users\Hi\AppData\Roaming\helm\registry\config.json")
      --repository-cache string         path to the directory containing cached repository indexes (default "C:\Users\Hi\AppData\Local\Temp\helm\repository")
      --repository-config string        path to the file containing repository names and URLs (default "C:\Users\Hi\AppData\Roaming\helm\repositories.yaml")

Use "helm dependency [command] --help" for more information about a command. verifies every entry in Chart.lock against a
        # KNOWN repository even when the .tgz is already vendored under
        # charts/, so it fails with "no repository definition" on a clean
        # runner while the identical command succeeds on a laptop that added
        # the repo months ago. The OCI dependency needs no line here: an
        # oci:// reference is resolved by registry, not by repo alias.
        run: helm repo add qdrant https://qdrant.github.io/qdrant-helm

      - name: Helm dependency build
        # Uses the checked-in Chart.lock + charts/*.tgz — a PR that bumps a
        # dependency version must run `helm dependency update` locally and
        # commit the result, so CI proves the SAME lock the reviewer saw,
        # never a freshly re-resolved one.
        run: helm dependency build "charts/${{ matrix.chart }}"

      - name: Helm lint
        run: helm lint "charts/${{ matrix.chart }}"

      - name: Helm template (smoke test)
        run: |
          helm template test "charts/${{ matrix.chart }}" \
            --set bootstrap.token=ci-smoke-test \
            --set instance.id=ci-smoke-test \
            --set instance.name=ci-smoke-test \
            > /dev/null

  build:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    strategy:
      matrix:
        chart: [agentos, expert-academy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Register dependency repositories
        # Manage the dependencies of a chart.

