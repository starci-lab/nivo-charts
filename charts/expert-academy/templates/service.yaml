# ONE Service in front of the ONE app pod (api + web) -- biz.md section 6:
# no OpenClaw, no n8n, so there is no command-API/webhook wall to keep apart
# (contrast charts/agentos, where "exactly one component listens" is the
# whole point and the split is an application-layer routing decision inside
# a single port). Both ports are named so an Ingress can path-route
# `ingress.api.path` / `ingress.web.path` (values.yaml) at this one Service
# by port name -- the Ingress template itself is out of this slice's scope.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "expert-academy.fullname" . }}
  labels:
    {{- include "expert-academy.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "expert-academy.selectorLabels" . | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.appPod.api.port }}
      targetPort: api
      protocol: TCP
    - name: web
      port: {{ .Values.appPod.web.port }}
      targetPort: web
      protocol: TCP
