# The single app pod: `api` (GraphQL, apps/expert-academy-api) + `web` (the
# public course site). biz.md section 6 is explicit this is NOT a second
# copy of the AgentOS pod -- no OpenClaw, no n8n -- so there is no
# command-API/webhook wall to keep apart here (that split is entirely
# internal to AgentOS's controlplane, biz.md section 5). Both containers are
# public on purpose; see values.yaml's `ingress` comment for why one Ingress
# with two path-routed backends is enough.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "expert-academy.fullname" . }}
  labels:
    {{- include "expert-academy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.appPod.replicas }}
  selector:
    matchLabels:
      {{- include "expert-academy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "expert-academy.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "expert-academy.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: api
              containerPort: {{ .Values.appPod.api.port }}
          env:
            - name: PORT
              value: {{ .Values.appPod.api.port | quote }}
            # biz.md sections 4 and 7: this value IS the RAG isolation
            # boundary -- nivo-backend's `@modules/rag/instance-identity`
            # derives the Qdrant collection name from it and REFUSES
            # readiness while it is blank, rather than falling back to a name
            # two misconfigured instances could collide on (see
            # `expertApp.instanceId`'s doc comment in
            # src/modules/platform/env/config.ts). `.Values.instance.id` is
            # the SAME id the release, namespace and hostname are already
            # keyed on -- not a second identity minted here.
            - name: EXPERT_INSTANCE_ID
              value: {{ .Values.instance.id | quote }}
            # The postgresql subchart's generated Service, computed rather
            # than hand-named -- see values.yaml's "GENERATED-SECRET NAMING"
            # comment. Bitnami's fullname convention with no nameOverride on
            # the dependency gives `<release-name>-postgresql`.
            - name: POSTGRES_HOST
              value: {{ printf "%s-postgresql" .Release.Name | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.postgresql.primary.service.ports.postgresql | default 5432 | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  # Bitnami writes the CUSTOM user's password under the
                  # `password` key -- only the `postgres` superuser gets
                  # `postgres-password`. `postgresql.auth.username` above
                  # (`expert_academy`) is never the superuser, so `password`
                  # is the key that actually exists in this Secret.
                  name: {{ printf "%s-postgresql" .Release.Name | quote }}
                  key: password
            # The official qdrant chart's generated Service, REST port 6333
            # -- NOT expert-academy-api's own local-dev default of 6350 (see
            # `expertApp.qdrantUrl`'s neighbouring comment in config.ts,
            # which exists precisely to warn against that mismatch). No
            # `QDRANT_API_KEY`: `qdrant.apiKey` is left at the subchart's own
            # default of `false` in values.yaml, so the store answers
            # unauthenticated in-cluster -- the same network-only boundary
            # postgresql relies on.
            - name: QDRANT_URL
              value: {{ printf "http://%s-qdrant:6333" .Release.Name | quote }}
            # THE ONE VARIABLE THIS IMAGE HARD-REQUIRES AT MODULE LOAD --
            # confirmed against this chart's own `api` image on the live
            # kind-nivo-e2e cluster: unset, the container throws
            # `MISSING_ENV_VAR_EXCEPTION` before Nest builds a single module
            # and CrashLoopBackOffs before ever reaching a probe
            # (`@modules/integrations/media/media-token.ts:32`,
            # `requireEnv("MEDIA_SIGNING_SECRET")`). Sourced from
            # templates/secret.yaml's own Secret -- generated by the chart
            # itself and never carried in a Helm value, the same rule that
            # keeps the postgresql password out of values.yaml.
            - name: MEDIA_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-media-signing" (include "expert-academy.fullname" .) | quote }}
                  key: MEDIA_SIGNING_SECRET
            # DELIBERATELY UNSET, each for a stated reason rather than by
            # oversight:
            #
            #   CORS_ORIGIN   blank reflects the request's own Origin header
            #                 (expert-academy-api/src/main.ts) -- correct for
            #                 both the platform host and any future custom
            #                 domain, and ingress.api.path/ingress.web.path
            #                 already serve api+web off one host, so most
            #                 calls are same-origin anyway.
            #   KEYCLOAK_*    biz.md section 9, open question 2, is
            #                 unresolved: whether this product gets a
            #                 per-instance identity provider (the AgentOS
            #                 shape) or points at nivo's one central realm.
            #                 Either answer is a real hostname this chart
            #                 does not have yet -- inventing one here would
            #                 be exactly the second provisioning story
            #                 biz.md warns against.
            #   INSTANCE_OPENROUTER_API_KEY
            #                 biz.md section 7: the model key is minted by
            #                 backend's KeyManager and handed to the pod
            #                 once, NEVER carried in a Helm value. The
            #                 hand-off mechanism (a single-use bootstrap
            #                 token exchanged for the real secret, biz.md
            #                 section 8) is exactly the AgentOS shape
            #                 section 9's open question asks whether this
            #                 product adopts -- `provision.*` in values.yaml
            #                 is OFF for the same reason. Wiring a real
            #                 value here ahead of that decision would be a
            #                 leaked secret in a public chart.
          resources:
            {{- toYaml .Values.appPod.api.resources | nindent 12 }}
          # /health/ready pings Postgres (see HealthController in
          # nivo-backend/src/modules/platform/health) and this instance's own
          # RAG collection identity; /health/live never touches a dependency,
          # so a database blip never gets the pod killed and restarted -- a
          # restart would not have fixed it.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: api
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: api
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
        - name: web
          image: "{{ .Values.image.web.repository }}:{{ .Values.image.web.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: web
              containerPort: {{ .Values.appPod.web.port }}
          env:
            - name: PORT
              value: {{ .Values.appPod.web.port | quote }}
            # In-cluster, straight to the api Service's own port -- server-
            # side rendering has no reason to leave the cluster, hairpin
            # through the Ingress and come back. Mirrors the equivalent
            # `EXPERT_API_URL` wiring in the pre-existing
            # nivo/k8s/charts/expert chart's fe.yaml (see that file's header
            # for why a NEXT_PUBLIC_-prefixed variable would NOT work here:
            # Next.js inlines those at build time, and one shared image
            # cannot bake in a per-instance origin).
            - name: EXPERT_API_URL
              value: {{ printf "http://%s:%v" (include "expert-academy.fullname" .) .Values.appPod.api.port | quote }}
          resources:
            {{- toYaml .Values.appPod.web.resources | nindent 12 }}
          # `/` is the course site's own landing page; answering 200 also
          # proves the api is reachable from this container (see
          # EXPERT_API_URL above), which is more than a static-asset probe
          # would prove.
          readinessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 15
            periodSeconds: 10
