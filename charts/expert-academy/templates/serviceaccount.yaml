# Identity for the app pod's own k8s API calls -- today that is NONE:
# `rbac.create` stays false in values.yaml because, unlike charts/agentos,
# this pod spawns no Jobs (no `nivo-cli index-pending`/`sync-knowledge`
# equivalent exists for this product yet). Created anyway so a
# ServiceAccount always exists to bind a Role to the day `provision.*`
# turns on and biz.md section 9's open question 2 resolves toward the
# AgentOS shape -- see values.yaml's header comment for that open question.
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "expert-academy.serviceAccountName" . }}
  labels:
    {{- include "expert-academy.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
