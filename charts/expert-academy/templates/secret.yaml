# MEDIA_SIGNING_SECRET -- confirmed (nivo-backend, grep of
# src/modules/integrations/media/media-token.ts) to be a HARD requirement
# with no fallback: `requireEnv("MEDIA_SIGNING_SECRET")` is read once at
# module load by an app-wide provider, so a deployment missing it fails at
# boot, not at the first playback request. As of this writing
# templates/deployment.yaml (a separate slice) does not set this env var at
# all on the `api` container -- meaning today, wired together as-is, the api
# container CrashLoopBackOffs. This Secret exists so that gap has something
# to be closed against; see this chart's report for the one-line follow-up
# deployment.yaml still needs (a `secretKeyRef` to the key below).
#
# NO SECRET GOES IN A CHART OR ITS VALUES (biz.md section 8) is why this is
# NOT modelled on the pre-existing k8s/charts/expert pattern (see
# nivo-backend's provision-secret-keys.ts), which mints this outside the
# cluster and passes it in as a `secrets.mediaSigningSecret` Helm value --
# a value that survives `helm get values`, CI logs and backend request logs.
# Instead this chart mints it itself, the same way the Bitnami subcharts
# auto-generate their own passwords when a values field is left blank:
# `lookup` reads back this release's existing Secret (always empty during
# `helm template`, since that command never contacts a cluster -- which is
# exactly why the CI smoke test in .github/workflows still renders cleanly
# with no live cluster behind it) and a fresh 32-byte value is minted only
# the first time the Secret does not yet exist, so a later `helm upgrade`
# never rotates it out from under playback tokens already handed to a
# learner's browser.
{{- $secretName := printf "%s-media-signing" (include "expert-academy.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "expert-academy.labels" . | nindent 4 }}
type: Opaque
data:
  MEDIA_SIGNING_SECRET: {{ if $existing }}{{ index $existing.data "MEDIA_SIGNING_SECRET" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
