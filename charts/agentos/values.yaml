# AgentOS — one instance, one release.
#
# NOTHING SECRET BELONGS IN THIS FILE, and that is not a style rule. biz.md
# section 8: a value placed in Helm values survives in `helm get values`, in
# CI logs, and in backend request logs — three places a credential must never
# sit. The only credential this chart carries is the SINGLE-USE bootstrap
# token, and it is passed at install time (`--set bootstrap.token=...`), never
# written here. Everything else — n8n/OpenClaw/MinIO/Qdrant/Postgres
# credentials — the instance generates for itself on first boot, or (for the
# store subcharts below) is auto-generated by the subchart into its own k8s
# Secret when left blank. Templates read those Secrets by name; they are never
# copied into a ConfigMap or back into a `values.yaml`.
#
# GENERATED-SECRET NAMING, for whoever writes the Deployment template: with no
# `nameOverride`/`fullnameOverride` set on a subchart block, Bitnami's fullname
# convention gives `<release-name>-postgresql` and `<release-name>-minio`, and
# each exposes its own `-secret-key-name`-shaped output (see `helm show
# values` on the subchart for the exact Secret + key). Read the Secret by that
# computed name; do not hand the password through `values.yaml` at any point.

global:
  # Bitnami subcharts read `global.imageRegistry` / `global.imagePullSecrets`
  # / `global.storageClass` themselves; set once here instead of three times
  # under postgresql/minio/qdrant.
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

nameOverride: ""
fullnameOverride: ""

# Identity of this instance. `instanceId` is the id the backend allocated; the
# namespace and the hostname are both derived from it. `baseDomain` is a
# knob, not a hardcode — biz.md section 5 only fixes the SHAPE
# (`<name>.<baseDomain>`), not the literal domain, and provisioning allocates
# the hostname at install time (biz.md section 8, step 1).
instance:
  id: ""
  name: ""
  baseDomain: agentos.nivo.vn

image:
  # Set `pullPolicy: Never` for a kind/k3s cluster the images were
  # side-loaded into: with `IfNotPresent` a locally-loaded tag still sends
  # the kubelet to a registry when the tag looks remote, and the pod sits in
  # ImagePullBackOff while the image is already on the node.
  pullPolicy: IfNotPresent
  controlplane:
    repository: nivo/agentos-controlplane
    tag: "0.1.0"
  openclaw:
    repository: nivo/openclaw
    tag: "latest"
  n8n:
    repository: docker.n8n.io/n8nio/n8n
    tag: "1.64.3"
  # The one image every Job and hook in this chart runs — `nivo-cli`
  # (biz.md section 5): one image, every subcommand. Kept separate from
  # `controlplane` because the hook and Jobs below reference it by name.
  cli:
    repository: nivo/agentos-cli
    tag: "0.1.0"

# Private, namespace-local malware scanner for uploaded module documents.
# The central object is a quarantine/backup copy; only the verified workspace
# replica reaches this scanner and then Qdrant. No Service or Ingress exposes
# clamd outside the workspace namespace.
clamav:
  enabled: true
  image:
    repository: clamav/clamav
    tag: stable_base
    pullPolicy: IfNotPresent
  port: 3310
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: "1", memory: 1536Mi }

# The single app pod. `replicas: 1` is not a tuning knob — it is a
# Deployment (not a bare Pod) purely for RESCHEDULING when a node is lost,
# never for horizontal scale: OpenClaw holds channel sessions, so a second
# replica would double-handle them, and n8n in default mode double-fires
# every schedule with two mains (biz.md section 5, section 8 "Scaling").
# There is deliberately no top-level `replicas` field to raise — templates
# must hardcode 1 and say why, not read it from here.
appPod:
  # `openclaw.enabled: false` exists for local/dev bring-up ONLY — a kind
  # cluster building the controlplane and the store subcharts often has no
  # OpenClaw image to pull yet, and biz.md's "no sidecar, no initContainer"
  # pod means one crash-looping container drags the whole Deployment's
  # rollout status down with it. Production always runs it; a chart that
  # ships with it disabled is not provisioned, it is broken.
  openclaw:
    enabled: true
    port: 3100
    controlUiBasePath: /openclaw
    resources:
      requests: { cpu: 100m, memory: 192Mi }
      limits: { cpu: "1", memory: 384Mi }
  controlplane:
    # The only container behind the INGRESS — biz.md section 5: "Exactly one
    # component listens". openclaw/n8n/mcp below are reached by the
    # controlplane over `localhost` inside this same pod. n8n additionally
    # has an internal ClusterIP Service (templates/service-n8n.yaml), because
    # the `agentos-cli provision` hook Job runs in its OWN pod and must dial
    # n8n by name; a ClusterIP is not exposure — the Ingress is, and it
    # points only here.
    port: 3000
    resources:
      requests: { cpu: 100m, memory: 192Mi }
      limits: { cpu: "1", memory: 384Mi }
  n8n:
    port: 5678
    resources:
      requests: { cpu: 100m, memory: 384Mi }
      limits: { cpu: "1", memory: 768Mi }

namespace:
  resources:
    requestsMemory: 2Gi
    limitsMemory: 4Gi

# The ONE thing Helm carries that is credential-shaped, and it buys exactly
# one call: `registerKey(publicKey)`. Single-use, short-lived, dead once
# spent (biz.md section 8). The pod generates its own key pair on first boot
# and the private half never leaves it.
bootstrap:
  token: ""
  # Where the instance calls OUT to. All traffic runs one direction: the
  # instance calls the backend, the backend never calls in (biz.md section 8,
  # "One direction").
  backendUrl: ""

# The single public surface, walled into two halves INSIDE the controlplane
# process (biz.md section 5): the command API answers a Keycloak JWT plus the
# owner check, the webhook ingress answers a platform signature. This chart
# only has to expose one port to get both — the split is an application-layer
# routing decision, not a second Ingress.
ingress:
  enabled: true
  # Tino workers run the k3s-bundled Traefik controller.
  className: traefik
  # Falls back to `<instance.name>.<instance.baseDomain>` when blank — see
  # `agentos.hostname` in _helpers.tpl. Set explicitly only to override that
  # derivation.
  host: ""
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    # cert-manager issues the public certificate into `<release>-tls` when
    # no shared wildcard secret is supplied.
    enabled: true
    secretName: ""

# `agentos-cli provision` as a Helm `post-install`/`post-upgrade` hook Job —
# NOT an initContainer. An initContainer re-runs on EVERY pod restart: a node
# drain, an OOM, an upgrade. A 60-second seed would then cost 60 seconds of
# silent agent each time. A hook runs once per RELEASE event, and a plain
# restart costs nothing because the controlplane finds the provision marker
# already current (biz.md section 8).
provision:
  enabled: true
  # A failed hook fails the Helm release, so a broken provision surfaces at
  # deploy time rather than at the customer's first chat (biz.md section 8).
  backoffLimit: 2
  activeDeadlineSeconds: 900

# `agentos-cli backup` as a CronJob — the same command the recovery ladder's
# rung 3/4 runs by hand (biz.md section 8, "Wipe"). Off by default: turning it
# on is a per-instance decision made at provision time, not a chart default.
backup:
  enabled: false
  schedule: "0 3 * * *"

# RBAC for the controlplane's own Job-spawning (index-pending,
# sync-knowledge). It needs `create`/`get`/`list`/`delete` on `jobs` in ITS
# OWN namespace and nothing else: RBAC to run arbitrary images on the
# internet-facing component is a privilege escalation on top of compromising
# it — "run any image here" would additionally buy persistence in the cluster
# (biz.md section 5, rule 4). The Job's pod spec itself is pinned to the
# `nivo-cli` image by an admission policy, which is a cluster-level policy
# object outside this chart's scope, not a Helm value.
rbac:
  create: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

# --- Wipe gate: do stores lose their data when this release is removed? ----
#
# biz.md section 8's recovery ladder puts a destroy behind BACKUP -> VERIFY ->
# DESTROY (rung 3/4, "Wipe") — an unverified backup does not authorise a
# destroy. A chart where `helm uninstall` silently takes the customer's
# volumes with it removes that gate entirely: one mistyped release name and
# the data is gone with no backup and no verification in between.
#
# DEFAULT MUST STAY false. Dev and e2e teardown (which rebuilds every store
# from nothing on the next install anyway) is the only caller that should
# ever set this true; a customer release never does. Do not "fix" this
# default to true for convenience later — that is precisely the mistake this
# comment is here to head off.
#
# Helm values.yaml cannot cross-reference one key from another, so this
# single flag names the INTENT and is wired by hand at the field each store
# subchart actually exposes for it — see the comment on each one below:
#   - postgresql: a real StatefulSet + volumeClaimTemplate, and the Bitnami
#     chart natively exposes `primary.persistentVolumeClaimRetentionPolicy`
#     for it (k8s 1.27+ GA feature — the StatefulSet controller does the
#     delete itself, no hook, no extra RBAC).
#   - minio: `mode: standalone` below makes this a Deployment + a plain PVC,
#     not a StatefulSet — the k8s retention-policy field does not apply to
#     it at all. The PVC is a normal Helm-managed release resource instead,
#     so the lever is Helm's own `helm.sh/resource-policy` annotation.
#   - qdrant: THE OFFICIAL qdrant-helm CHART (1.18.2) DOES NOT TEMPLATE THIS
#     FIELD ANYWHERE — verified against its `templates/statefulset.yaml`,
#     which has no `persistentVolumeClaimRetentionPolicy` in any code path.
#     Its StatefulSet-owned PVCs are consequently never touched by `helm
#     uninstall` today with zero configuration on our part, so the SAFE
#     (false) side of this gate already holds for qdrant for free — but
#     there is no lever here to opt a dev/e2e teardown INTO wiping it; that
#     has to happen out-of-band (`kubectl delete pvc`) until upstream adds
#     the field. Do not invent a value here that looks wired but is not.
persistence:
  deleteOnUninstall: false

# --- Stores: subcharts, each its own workload -------------------------------
#
# Deployments run "start-new-before-stopping-old" by default, which deadlocks
# a stateful workload on an RWO volume (or corrupts it on RWX — two processes
# over one data directory). Bitnami's postgresql/minio charts and the
# official qdrant chart all model their workload as a StatefulSet for exactly
# this reason; that is the point of pulling them in as dependencies instead
# of hand-rolling three more StatefulSets in this chart.

postgresql:
  enabled: true
  auth:
    # Left BLANK on purpose — Bitnami generates a random password into its
    # own Secret (`<release>-postgresql`) on install and reuses it on every
    # upgrade. Setting a password here would put it in `helm get values`,
    # which is exactly what biz.md section 8 forbids.
    database: agentos
    username: agentos
    password: ""
    postgresPassword: ""
  primary:
    persistence:
      size: 8Gi
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: "1", memory: 384Mi }
    # Wipe gate — see top-level `persistence.deleteOnUninstall`. Native
    # Bitnami field, StatefulSet + volumeClaimTemplate, k8s 1.27+. A dev/e2e
    # overlay that sets `persistence.deleteOnUninstall: true` must flip BOTH
    # `enabled: true` and `whenDeleted: Delete` here — `enabled: true` alone
    # with `whenDeleted` left at `Retain` is a no-op. `whenScaled` stays
    # `Retain` always — a replica-count change is never the "wipe" this gate
    # is about, only a full release deletion is.
    persistentVolumeClaimRetentionPolicy:
      enabled: false
      whenScaled: Retain
      whenDeleted: Retain
  # THE FROZEN, CONFIRMED-TO-EXIST TAG. Bitnami's own chart default is
  # `repository: bitnami/postgresql, tag: latest` (verified by pulling the
  # chart) — a moving tag under a pinned CHART version, which defeats the
  # point of pinning. `bitnamilegacy/*` is the free path that stopped
  # receiving new tags and therefore cannot move under us.
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: "17.6.0-debian-12-r4"
  # Only reached if `volumePermissions.enabled: true` — pin its sub-image too,
  # it defaults to `latest` independently of the main postgresql image.
  volumePermissions:
    enabled: false
    image:
      registry: docker.io
      repository: bitnamilegacy/os-shell
      tag: "12-debian-12-r51"
  # Off by default: a scrape target is a cluster-wide monitoring decision,
  # not a per-instance chart default. Pinned here anyway so turning it on
  # later doesn't silently pull `latest`.
  metrics:
    enabled: false
    image:
      registry: docker.io
      repository: bitnamilegacy/postgres-exporter
      tag: "0.17.1-debian-12-r16"

minio:
  enabled: true
  # Standalone mode — this is per-instance object storage for one customer's
  # uploads (biz.md section 5, "Document upload"), not a shared data lake
  # that needs MinIO's own erasure-coded distributed mode.
  mode: standalone
  auth:
    # BLANK on purpose, same reasoning as postgresql.auth above — Bitnami
    # generates and stores this itself.
    rootUser: admin
    rootPassword: ""
  persistence:
    size: 20Gi
    # Wipe gate — see top-level `persistence.deleteOnUninstall`. `mode:
    # standalone` above makes this PVC a plain Helm-managed resource, not a
    # StatefulSet volumeClaimTemplate, so the k8s retention-policy field does
    # not apply here — Helm's own `resource-policy` annotation is the real
    # lever. `keep` matches `deleteOnUninstall: false`: `helm uninstall`
    # leaves this volume behind. A dev/e2e overlay that wants uninstall to
    # take it must null out this exact key (Helm merges maps from `--set`,
    # it does not replace them — `--set-json '...annotations={}'` is a
    # no-op here, the base `keep` key survives the merge):
    # `--set 'minio.persistence.annotations.helm\.sh/resource-policy=null'`
    annotations:
      helm.sh/resource-policy: keep
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 384Mi }
  image:
    registry: docker.io
    repository: bitnamilegacy/minio
    tag: "2025.7.23-debian-12-r5"
  # The `mc`-based provisioning job Bitnami's chart runs on install/upgrade
  # to create buckets/policies — pin it too, same reasoning as postgresql's
  # volumePermissions image.
  clientImage:
    registry: docker.io
    repository: bitnamilegacy/minio-client
    tag: "2025.7.21-debian-12-r3"
  # OFF by default in the upstream chart too — only reached if someone flips
  # it on. Pinned anyway, same reasoning as postgresql.volumePermissions
  # above: this is the exact shape of gap that let `console.image` below
  # escape the pinning discipline (a Bitnami sub-image that defaults to its
  # own `latest`-tracking `bitnami/*` path independently of the main
  # `minio.image`), just not yet triggered because it is disabled.
  defaultInitContainers:
    volumePermissions:
      enabled: false
      image:
        registry: docker.io
        repository: bitnamilegacy/os-shell
        tag: "12-debian-12-r51"
  # THE DEFECT: Bitnami's own chart default is `console.enabled: true`
  # pointing at `bitnami/minio-object-browser` — NOT `bitnamilegacy` — so it
  # was never caught by pinning `minio.image`/`minio.clientImage` above and
  # produced ImagePullBackOff on the real install. Nothing in biz.md needs a
  # MinIO web console for a per-instance object store the controlplane owns
  # programmatically (biz.md section 5/8), so disable it outright rather than
  # chase a legacy tag for a UI no one is meant to open.
  console:
    enabled: false

qdrant:
  enabled: true
  # Single node — this is one customer's own vector store (their cloned
  # playbook plus their uploaded-document embeddings, biz.md section 4/8),
  # not a shared cluster that needs Qdrant's distributed mode.
  replicaCount: 1
  persistence:
    size: 8Gi
    # No wipe-gate knob here — see top-level `persistence.deleteOnUninstall`'s
    # qdrant bullet: qdrant-helm 1.18.2 does not template
    # `persistentVolumeClaimRetentionPolicy` at all, so its
    # StatefulSet-owned PVC is already never touched by `helm uninstall`
    # (the safe default holds for free) and there is no lever here to opt
    # a dev/e2e teardown into deleting it.
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
  # `image.tag: ""` on the official chart falls through to `appVersion`,
  # which is fixed by the DEPENDENCY VERSION pin in Chart.yaml — leave it
  # blank rather than duplicating the version in two places that can drift.
  image:
    tag: ""
