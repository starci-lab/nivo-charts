{{/*
The n8n owner password -- ONE static value, minted by this template into a
k8s Secret and read by BOTH of its consumers: `agentos-cli provision`
(job-provision.yaml), which creates the n8n owner account with it and then
logs back in as that owner to mint the API key, and the controlplane
(deployment.yaml), which drives the same n8n afterwards. Minting it twice
would mean the controlplane holding a password n8n never accepted -- one
value with two readers is the whole reason it is a Secret rather than two
independent `randAlphaNum` calls.

WHY THIS IS NOT THE THING biz.md SECTION 8 FORBIDS. Section 8 forbids a
secret in VALUES: "a secret placed in Helm values survives in `helm get
values`, in CI logs and in backend request logs -- three places a long-lived
credential must never sit". A Secret resource a TEMPLATE creates for itself
sits in none of those three. `helm get values` replays the user-supplied
values, and nobody supplied this one; no CI command line ever types it; it
never travels a backend request at all. The rule is about where a credential
is CARRIED, not about whether one may exist -- biz.md section 7 has the
instance holding n8n / OpenClaw / MinIO / Qdrant credentials by
construction. Note the one thing that follows: this password must never be
promoted into `values.yaml` as a knob, not even an optional one, because
that is precisely the move section 8 rules out.

REUSED, NEVER REGENERATED. `lookup` reads the Secret already on the cluster
and keeps the value it finds; a fresh one is minted only when there is none.
This is biz.md section 8's failure mode 3 verbatim -- "internal credentials
are regenerated on restart ... persist and reuse; generate only when absent"
-- and it is exactly why a bare `randAlphaNum` here would be a BUG and not a
shortcut. Helm re-renders every template on every `helm upgrade`, so an
unconditional generator would rotate this password out from under an n8n
that already has an owner account created with the OLD one; the next
`provision` run would fail its login with a 401 that reads like n8n being
broken rather than like the chart having changed the password.

THE ONE REAL LIMITATION, stated rather than papered over: `lookup` has no
cluster to query during `helm template`, `helm lint` and `--dry-run`, where
it returns an empty map by design. A rendered manifest therefore shows a
DIFFERENT password on every render. That is expected output, not drift, and
it must not be "fixed" by dropping `lookup` -- doing so would trade a
cosmetic diff in a dry run for a real credential rotation on every upgrade
of every live instance.

THE PASSWORD SHAPE IS NOT DECORATIVE. n8n's own owner-setup endpoint
enforces a password policy (a minimum length, at least one digit, at least
one uppercase letter) and rejects what fails it; `randAlphaNum 32` alone can
easily produce a string with no uppercase letter or no digit, which would
turn into an intermittent provision failure that reproduces perhaps one run
in ten. Composing the three classes explicitly makes every generated value
satisfy the policy by construction.

`agentos.n8nSecretName` and `agentos.n8nOwnerPasswordKey` are defined HERE
rather than in `_helpers.tpl` (which is off-limits -- the same reason
secret.yaml defines `agentos.bootstrapSecretName` inside itself), so
job-provision.yaml and deployment.yaml both resolve the identical name and
key through `include` instead of the string being re-typed in three places
where two of them can silently fall out of step.
*/}}
{{- define "agentos.n8nSecretName" -}}
{{ include "agentos.fullname" . }}-n8n
{{- end }}

{{- define "agentos.n8nOwnerPasswordKey" -}}
owner-password
{{- end }}

{{- $n8nSecretName := include "agentos.n8nSecretName" . }}
{{- $n8nPasswordKey := include "agentos.n8nOwnerPasswordKey" . }}
{{- $existingN8nSecret := lookup "v1" "Secret" .Release.Namespace $n8nSecretName }}
{{- $n8nOwnerPassword := "" }}
{{- if $existingN8nSecret }}
{{- $existingData := $existingN8nSecret.data | default dict }}
{{- if hasKey $existingData $n8nPasswordKey }}
{{- $n8nOwnerPassword = index $existingData $n8nPasswordKey }}
{{- end }}
{{- end }}
{{- if eq $n8nOwnerPassword "" }}
{{- $n8nOwnerPassword = printf "%s%s%s" (randAlpha 6 | upper) (randNumeric 4) (randAlphaNum 22) | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $n8nSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
    app.kubernetes.io/component: n8n
type: Opaque
# `data`, not `stringData`: the value read back out of the cluster by
# `lookup` above is already base64, so keeping the wire format identical on
# both paths means the reused branch and the freshly-generated branch write
# the byte-identical field rather than one of them double-encoding.
data:
  {{ $n8nPasswordKey }}: {{ $n8nOwnerPassword }}
