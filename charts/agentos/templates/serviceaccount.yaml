# The app pod's identity. RBAC (Role/RoleBinding) granting this identity
# `create`/`get`/`list`/`delete` on `jobs` in its own namespace -- for the
# controlplane's index-pending / sync-knowledge Job-spawning, biz.md section
# 5 rule 4 -- is a separate template keyed off `.Values.rbac.create`; this
# file only creates the ServiceAccount itself.
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentos.serviceAccountName" . }}
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
