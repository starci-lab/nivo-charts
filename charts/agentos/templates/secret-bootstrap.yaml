# The ONE credential-shaped value this chart carries, exactly as far as it is
# allowed to travel (biz.md section 8): `--set bootstrap.token=...` at install
# time, never a file, never `values.yaml` committed anywhere. This Secret
# exists only to hand that value to the provision hook Job as a
# `secretKeyRef` -- so it never appears in the Job's own pod spec (`kubectl
# get job -o yaml` shows a Secret NAME, not the token), which is the point of
# a Secret indirection over a plain env value here.
#
# SHARES THE PROVISION JOB'S HOOK PHASE, ON PURPOSE, so it exists only as long
# as that phase does: both this Secret and the Job in job-provision.yaml are
# annotated for the SAME event (`post-install,post-upgrade`), this Secret at
# a lower hook-weight so it is created first, and both carry
# `hook-succeeded` in their delete-policy. Helm evaluates a hook phase's
# delete-policy once the phase's Jobs/Pods finish, not per-resource on
# creation, so this does not vanish before the Job can read it -- it is
# removed together with the Job once biz.md's "buys exactly one call... once
# used, it is dead" is actually true on the cluster, not just true in the
# CLI's own bookkeeping.
#
# Read by `apps/agentos-cli/src/env/parse-env.ts` -> `config.controlPlane
# .registrationToken` as `NIVO_POD_REGISTRATION_TOKEN` (verified against
# nivo-backend's own source -- see this task's `notes`).
{{- if .Values.provision.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentos.fullname" . }}-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
data:
  token: {{ .Values.bootstrap.token | default "" | b64enc }}
{{- end }}
