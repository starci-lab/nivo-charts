{{- if .Values.clamav.enabled }}
# Uploaded bytes are scanned only after their verified replica arrives in the
# workspace. This Deployment is deliberately separate from the one-replica
# AgentOS app pod: virus-definition refreshes and scanner restarts must not
# restart OpenClaw channel sessions or n8n schedules.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentos.fullname" . }}-clamav
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
    app.kubernetes.io/component: clamav
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "agentos.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: clamav
  template:
    metadata:
      labels:
        {{- include "agentos.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: clamav
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: clamav
          image: "{{ .Values.clamav.image.repository }}:{{ .Values.clamav.image.tag }}"
          imagePullPolicy: {{ .Values.clamav.image.pullPolicy }}
          ports:
            - name: clamd
              containerPort: {{ .Values.clamav.port }}
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: clamd
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            tcpSocket:
              port: clamd
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: clamd
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.clamav.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  # The CLI defaults to CLAMAV_HOST=clamav. Namespaces isolate this stable
  # service name, so every workspace resolves only its own scanner.
  name: clamav
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
    app.kubernetes.io/component: clamav
spec:
  type: ClusterIP
  selector:
    {{- include "agentos.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: clamav
  ports:
    - name: clamd
      port: {{ .Values.clamav.port }}
      targetPort: clamd
      protocol: TCP
{{- end }}
