{{/*
The bootstrap credential this chart carries is the single-use bootstrap token
(biz.md section 8 step 3 / values.yaml's `bootstrap.token`). It buys exactly
one call — `registerKey(publicKey)` — and is dead the instant it is spent.
Rendered ONLY when a token is actually supplied at install time
(`--set bootstrap.token=...`); an empty default must not turn into an empty
Secret that then just sits there. On a later `helm upgrade` run without the
flag (the normal case — the token was already spent on first boot) this
template renders nothing and Helm prunes the Secret from the release: that
is correct, not a bug, per biz.md's "once used, it is dead" — nothing after
first registration ever needs to read it again. Whatever reads this Secret
(the `nivo-cli provision` hook Job) must mark the key `optional: true` in
its `secretKeyRef` for exactly that reason: absent-on-upgrade is the
expected steady state, not a misconfiguration.

`agentos.bootstrapSecretName` is defined HERE rather than in `_helpers.tpl`
(which is off-limits — see this chart's directory-level instructions) so
the Job template that consumes this Secret can still resolve the same name
via `include "agentos.bootstrapSecretName" .` instead of re-deriving it.
*/}}
{{- define "agentos.bootstrapSecretName" -}}
{{ include "agentos.fullname" . }}-bootstrap
{{- end }}

{{- define "agentos.openclawSecretName" -}}
{{ include "agentos.fullname" . }}-openclaw
{{- end }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "agentos.openclawSecretName" .) }}
{{- $password := randAlphaNum 48 }}
{{- $cookieSecret := randAlphaNum 48 }}
{{- if $existing }}
{{- $password = index $existing.data "gateway-password" | b64dec }}
{{- $cookieSecret = index $existing.data "launch-cookie-secret" | b64dec }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentos.openclawSecretName" . }}
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
type: Opaque
stringData:
  gateway-password: {{ $password | quote }}
  launch-cookie-secret: {{ $cookieSecret | quote }}

{{- if ne (.Values.bootstrap.token | toString) "" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentos.bootstrapSecretName" . }}
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.bootstrap.token | quote }}
{{- end }}
